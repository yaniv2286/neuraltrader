# NeuralTrader Private Fund Configuration
# =====================================

# Fund Settings
fund:
  name: "NeuralTrader Private Fund"
  version: "1.0.0"
  initial_capital: 100000
  target_arr: 0.25  # 25% annualized return
  max_drawdown: 0.20  # 20% maximum drawdown
  
# Data Settings
data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  start_date: "1975-01-01"
  end_date: "2024-12-31"
  max_tickers: 1000  # Top 1000 by liquidity
  
# Trading Settings
trading:
  max_positions: 10
  position_size: 0.10  # 10% per position
  sector_limit: 3  # Max 3 positions per sector
  leverage: 1.0  # No leverage
  
# Risk Management
risk:
  daily_loss_limit: 0.05  # 5% daily loss limit
  max_position_risk: 0.02  # 2% risk per position
  stop_loss_atr_multiplier: 2.0  # 2x ATR stop loss
  volatility_target: 0.20  # 20% annual volatility target
  
# Cost Model
costs:
  commission_per_trade: 1.0
  spread_pct: 0.001  # 0.1%
  slippage_pct: 0.0005  # 0.05%
  
# Market Regime
regime:
  spy_ticker: "SPY"
  vix_ticker: "VIX"
  sma_period: 200
  volatility_multiplier: 1.5
  
# ML Features
features:
  price_features: true
  volume_features: true
  technical_indicators: true
  regime_features: true
  cross_sectional: true
  
# Model Settings
models:
  ensemble_method: "weighted"
  cross_validation_folds: 5
  feature_selection: true
  hyperparameter_tuning: true
  
# Execution
execution:
  order_type: "LIMIT"
  time_in_force: "DAY"
  max_order_size: 1000000  # $1M max per order
  
# Logging
logging:
  level: "INFO"
  file: "data/processed/neuraltrader.log"
  max_size_mb: 100
  backup_count: 5
  
# Monitoring
monitoring:
  real_time_pnl: true
  risk_alerts: true
  daily_report: true
  monthly_report: true
  
# Development
development:
  dry_run: false
  paper_trading: true
  live_trading: false
  api_key_required: true
